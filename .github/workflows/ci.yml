name: CI

on:
  pull_request:
  push:
    branches:
      - master

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck and tests share a dependency install, and each is fast, so
  # one job keeps the feedback in a single place rather than paying for three
  # installs. Steps are ordered cheapest-first but do not short-circuit each
  # other — a PR should see every failure at once, not one per push.
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        if: '!cancelled()'
        run: bun run typecheck

      - name: Test
        if: '!cancelled()'
        run: bun run test

  # Nothing secret belongs in this repository, and once it is public a leaked
  # commit is permanent and indexed within minutes. This scans the PR's own
  # commits, so it catches a secret before it is ever merged.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # gitleaks needs history to diff a pull request's commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
