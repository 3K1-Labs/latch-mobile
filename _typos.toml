# Config for crate-ci/typos (.github/workflows/ci.yml, `typo check` job).
#
# Every entry here was verified against a real `typos` run over this repo,
# not added preemptively — see the reference open-source-readiness checklist
# for why that order matters: enabling a spell-checker as a required check
# against un-triaged pre-existing content just means every future PR inherits
# someone else's unfixed backlog.

[files]
extend-exclude = [
  # A ~3,300-line token registry (name/address/symbol/decimals/chainId) for
  # swap routing, not prose. Real asset names and tickers (TRU, ALLO, THQ,
  # WRON, "StablR Euro", "The Virtua Kolect") collide with English near-misses
  # by chance, and will keep doing so as tokens are added — this is data to
  # exclude permanently, not typos to fix once.
  "src/constants/tokens.ts",
]

[default.extend-words]
# Real, deliberately-used compsci term ("failed to parse"). typos prefers
# "unparsable"; this codebase uses "unparseable" consistently across error
# messages and comments — mapped to itself rather than "corrected" everywhere.
unparseable = "unparseable"
Unparseable = "Unparseable"
# Tokenizer fragments, not misspellings: "mis-cleared"/"mis-encodes" (hyphen
# splits "mis" off as its own word), and "OTPs"/"OTAs"/"PNGs" (pluralized
# abbreviations split into a fragment — OT, PN — plus the plural suffix).
mis = "mis"
OT = "OT"
PN = "PN"
